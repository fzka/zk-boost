name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Necessário para o passo "Criar Release": por padrão o GITHUB_TOKEN
    # tem apenas leitura, e publicar uma release exige escrita em contents.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar executável
        shell: pwsh
        run: |
          # --onedir (e nao --onefile): o executavel nao se auto-extrai em
          # tempo de execucao, o que abre instantaneamente e reduz muito o
          # falso positivo de antivirus.
          $pyArgs = @(
            '--noconfirm',
            '--onedir',
            '--windowed',
            '--uac-admin',
            '--name', 'ZK-Boost',
            '--version-file', 'version_info.txt',
            '--collect-all', 'customtkinter',
            '--hidden-import', 'zk_diagnostics',
            '--hidden-import', 'zk_core',
            '--hidden-import', 'zk_theme',
            '--hidden-import', 'zk_ui_diagnostics'
          )
          if (Test-Path 'assets/icon.ico') {
            $pyArgs += @('--icon', 'assets/icon.ico')
          }
          pyinstaller @pyArgs zk_boost.py

      - name: Verificar metadados do executável
        shell: pwsh
        run: |
          $exe = Get-Item 'dist/ZK-Boost/ZK-Boost.exe'
          $info = $exe.VersionInfo
          Write-Output "ProductName : $($info.ProductName)"
          Write-Output "FileVersion : $($info.FileVersion)"
          Write-Output "Company     : $($info.CompanyName)"
          if (-not $info.ProductName) {
            throw "Metadados de versao ausentes no executavel."
          }

      - name: Empacotar release
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/ZK-Boost/*' -DestinationPath 'ZK-Boost-windows.zip' -Force
          $size = (Get-Item 'ZK-Boost-windows.zip').Length / 1MB
          Write-Output ("Pacote final: {0:N1} MB" -f $size)

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ZK-Boost-windows
          path: ZK-Boost-windows.zip
          retention-days: 30

      - name: Criar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ZK-Boost-windows.zip
          generate_release_notes: true