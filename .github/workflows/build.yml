name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar executável
        shell: pwsh
        run: |
          $pyArgs = @(
            '--noconfirm',
            '--onefile',
            '--windowed',
            '--uac-admin',              # pede elevação de Administrador ao abrir
            '--name', 'ZK-Boost',
            '--collect-all', 'customtkinter'
          )
          if (Test-Path 'assets/icon.ico') {
            $pyArgs += @('--icon', 'assets/icon.ico')
          }
          pyinstaller @pyArgs zk_boost.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ZK-Boost-windows
          path: dist/ZK-Boost.exe
          retention-days: 30

      - name: Criar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZK-Boost.exe
          generate_release_notes: true
